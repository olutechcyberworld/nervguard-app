name: nervguard
description: NervGuard — Autonomic Stress Detection and Intervention Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_riverpod: ^3.3.1
  # riverpod_annotation: ^4.0.2

  # ── BLE client ────────────────────────────────────────────────
  flutter_blue_plus: ^2.3.8

  # ── Android Foreground Service (background BLE + isolate) ─────
  flutter_foreground_task: ^9.2.2

  # ── Local notifications (background intervention delivery) ────
  flutter_local_notifications: ^22.0.1

  # ── Local database (Drift / SQLite) ───────────────────────────
  drift: ^2.18.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  

  # ── Cloud backend ─────────────────────────────────────────────
  supabase_flutter: ^2.6.0

  # ── Declarative navigation ────────────────────────────────────
  go_router: ^17.3.0

  # ── Network state (sync trigger) ─────────────────────────────
  connectivity_plus: ^7.1.1

  # ── Runtime permissions ───────────────────────────────────────
  permission_handler: ^12.0.3

  # ── Utilities ─────────────────────────────────────────────────
  uuid: ^4.4.2
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  
  build_runner: ^2.4.11

  # Drift schema codegen
  drift_dev: ^2.18.1

  # Unit test mocking
  mocktail: ^1.0.4
  fake_async: ^1.3.3


flutter:
  uses-material-design: true
  assets:
    - assets/brand/olutech_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#E53935"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"


dependency_overrides:
  meta: ^1.18.3